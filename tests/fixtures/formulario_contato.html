<!doctype html><html lang="pt-BR"><body>
<div class="jobs-easy-apply-modal" role="dialog">
  <button data-test-modal-close-btn aria-label="Descartar">×</button>
  <h2>Candidatar-se à vaga na Acme Tecnologia</h2>
  <form>
    <div data-test-form-element>
      <label for="tel">Celular</label>
      <input id="tel" type="text" required value="">
    </div>
    <div data-test-form-element>
      <label for="cidade">Cidade</label>
      <input id="cidade" type="text" aria-required="true" value="[cidade]">
    </div>
    <div data-test-form-element>
      <label for="pais">Código do país</label>
      <select id="pais" required>
        <option value="Selecione uma opção">Selecione uma opção</option>
        <option value="br" selected>Brasil (+55)</option>
      </select>
    </div>
  </form>
  <footer><button data-easy-apply-next-button aria-label="Avançar para próxima etapa">Avançar</button></footer>
</div>
</body></html>
