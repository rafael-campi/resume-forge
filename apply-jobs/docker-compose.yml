# Postgres local do bot. Porta 5433 no host para não colidir com outros Postgres em 5432.
# Subir: docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apply_jobs
      POSTGRES_PASSWORD: apply_jobs
      POSTGRES_DB: apply_jobs
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apply_jobs -d apply_jobs"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
