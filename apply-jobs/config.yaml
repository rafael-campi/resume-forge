# config.yaml
# Arquivo de configuração para o bot de automação do LinkedIn
# Define parâmetros de busca, filtros e comportamento do bot

search:
  # Palavras-chave para buscar vagas
  keywords: "Python Developer"
  
  # Localização desejada
  location: "Remote"
  
  # Número de páginas de resultados (ainda lido apenas como 1 página; paginação é o ticket #7)
  max_pages: 1

filters:
  # Palavras-chave obrigatórias no título ou descrição
  required_keywords:
    - "python"
    - "backend"
  
  # Palavras-chave que devem ser evitadas
  blocked_keywords:
    - "lead"
    - "manager"

apply:
  # Modo de envio: "confirmar" mostra o formulário preenchido e espera sua aprovação
  # no terminal; "auto" envia sozinho. Padrão: confirmar.
  mode: "confirmar"

  # De onde vem o currículo anexado:
  #   "fixo"  -> sempre o PDF de resume_path (comportamento original)
  #   "forge" -> o PDF que o resume-forge exportou para a Vaga (achado pelo job id). Sem PDF exportado,
  #              a Candidatura vai para Revisão manual até você revisar e exportar no resume-forge.
  curriculo: "fixo"

  # Caminho do currículo (PDF) usado quando curriculo: "fixo"
  resume_path: "storage/curriculo.pdf"

  # Número máximo de candidaturas enviadas por execução
  max_applications: 10
  
  # Delay entre aplicações (em segundos)
  delay_between_applications: 3
  
  # Aplicar apenas para vagas com "Easy Apply"
  easy_apply_only: true

browser:
  # Executar navegador em modo headless (exige apply.mode: auto)
  headless: false
  
  # Timeout para carregamento de elementos (em segundos)
  timeout: 10

  # Idioma da interface do LinkedIn (os seletores esperam português)
  language: "pt-BR"
